# MIDI Controller Mapping Preset
# Behringer X-Touch Compact - NanoVNA CLI Acoustic Analyzer
#
# Mapping based on aseqdump capture of the X-Touch Compact.
# The exact hardware layout will be documented separately.
#
# Mapping format: function_name=type,channel,number,command_name,ccfunction_name,description
# type: noteon, noteoff, cc
# channel: 0-15 (255 = any channel)
# number: MIDI note or CC number (0-127)
# command_name: symbolic name for command (e.g., toggle_curve_swr, solo_curve_rl, none)
# ccfunction_name: symbolic name for CC function (e.g., curve_volume_swr, master_volume, none)

preset_name=Behringer X-Touch Compact
preset_description=Mapping based on aseqdump capture for NanoVNA CLI acoustic analysis
controller_name=X-Touch Compact

# ==========================================
# Drehregler 1-5 (CC 10-14, Channel 0)
# Regeln die Lautstaerke der Kurven 1-5
# ==========================================
curve_volume_swr=cc,0,10,none,curve_volume_swr,Drehregler 1: Lautstaerke Kurve SWR
curve_volume_rl=cc,0,11,none,curve_volume_rl,Drehregler 2: Lautstaerke Kurve RL
curve_volume_impedance=cc,0,12,none,curve_volume_impedance,Drehregler 3: Lautstaerke Kurve |Z|
curve_volume_reactance=cc,0,13,none,curve_volume_reactance,Drehregler 4: Lautstaerke Kurve X
curve_volume_phase=cc,0,14,none,curve_volume_phase,Drehregler 5: Lautstaerke Kurve Phase

# ==========================================
# Drucktaster Kurven Ein/Aus (Note On 16-20, Channel 0)
# Kurven aktivieren/deaktivieren (Wechselschalter, nur Note On)
# ==========================================
toggle_curve_swr=noteon,0,16,toggle_curve_swr,none,Drucktaster Kurve SWR Ein/Aus
toggle_curve_rl=noteon,0,17,toggle_curve_rl,none,Drucktaster Kurve RL Ein/Aus
toggle_curve_impedance=noteon,0,18,toggle_curve_impedance,none,Drucktaster Kurve |Z| Ein/Aus
toggle_curve_reactance=noteon,0,19,toggle_curve_reactance,none,Drucktaster Kurve X Ein/Aus
toggle_curve_phase=noteon,0,20,toggle_curve_phase,none,Drucktaster Kurve Phase Ein/Aus

# ==========================================
# Drucktaster Solo (Note On 24-28, Channel 0)
# Kurven Solo schalten/deaktivieren (Wechselschalter, nur Note On)
# ==========================================
solo_curve_swr=noteon,0,24,solo_curve_swr,none,Drucktaster Solo Kurve SWR
solo_curve_rl=noteon,0,25,solo_curve_rl,none,Drucktaster Solo Kurve RL
solo_curve_impedance=noteon,0,26,solo_curve_impedance,none,Drucktaster Solo Kurve |Z|
solo_curve_reactance=noteon,0,27,solo_curve_reactance,none,Drucktaster Solo Kurve X
solo_curve_phase=noteon,0,28,solo_curve_phase,none,Drucktaster Solo Kurve Phase

# ==========================================
# Motor Fader 1-5 (CC 1-5, Channel 0)
# Werden vom Programm gesteuert um die Amplitude der Kurven 1-5 auszugeben.
# Diese Fader regeln selbst nichts, sie zeigen nur den aktuellen Wert an.
# ==========================================
curve_value_swr=cc,0,1,none,curve_value_swr,Motor Fader Amplitude Kurve SWR
curve_value_rl=cc,0,2,none,curve_value_rl,Motor Fader Amplitude Kurve RL
curve_value_impedance=cc,0,3,none,curve_value_impedance,Motor Fader Amplitude Kurve |Z|
curve_value_reactance=cc,0,4,none,curve_value_reactance,Motor Fader Amplitude Kurve X
curve_value_phase=cc,0,5,none,curve_value_phase,Motor Fader Amplitude Kurve Phase

# ==========================================
# Motor Fader Touch-Erkennung (CC 101-105, Channel 0)
# Wert 127 = Fader beruehrt, Wert 0 = Fader losgelassen
# Fuer Freeze-by-Touch: Playback einfrieren beim Beruehren
# ==========================================
fader_touch_swr=cc,0,101,none,fader_touch_swr,Motor Fader Touch Kurve SWR
fader_touch_rl=cc,0,102,none,fader_touch_rl,Motor Fader Touch Kurve RL
fader_touch_impedance=cc,0,103,none,fader_touch_impedance,Motor Fader Touch Kurve |Z|
fader_touch_reactance=cc,0,104,none,fader_touch_reactance,Motor Fader Touch Kurve X
fader_touch_phase=cc,0,105,none,fader_touch_phase,Motor Fader Touch Kurve Phase

# ==========================================
# Drucktaster unterhalb der Motor Fader (Note On 40-44, Channel 0)
# Abfrage des aktuellen Messwertes der jeweiligen Kurve an der aktuellen Position
# ==========================================
announce_curve_value_swr=noteon,0,40,announce_curve_value_swr,none,Drucktaster Wert abfragen Kurve SWR
announce_curve_value_rl=noteon,0,41,announce_curve_value_rl,none,Drucktaster Wert abfragen Kurve RL
announce_curve_value_impedance=noteon,0,42,announce_curve_value_impedance,none,Drucktaster Wert abfragen Kurve |Z|
announce_curve_value_reactance=noteon,0,43,announce_curve_value_reactance,none,Drucktaster Wert abfragen Kurve X
announce_curve_value_phase=noteon,0,44,announce_curve_value_phase,none,Drucktaster Wert abfragen Kurve Phase

# ==========================================
# Master Motor Fader (CC 9, Channel 0)
# Bidirektional: Bewegen steuert Master-Lautstaerke, Programmaenderung bewegt Fader
# ==========================================
master_volume=cc,0,9,none,master_volume,Master Motor Fader: Master Lautstaerke (bidirektional)

# ==========================================
# Master Volume Ansage (Note On 48, Channel 0)
# ==========================================
announce_master_volume=noteon,0,48,announce_master_volume,none,Drucktaster Master Lautstaerke ansagen

# ==========================================
# Transport-Tasten rechts unten (Note On, Channel 0)
# ==========================================
move_left=noteon,0,49,move_left,none,Drucktaster Scrub links
move_right=noteon,0,50,move_right,none,Drucktaster Scrub rechts
set_loop_left=noteon,0,51,set_loop_left,none,Drucktaster Loop Marker links
set_loop_right=noteon,0,52,set_loop_right,none,Drucktaster Loop Marker rechts
stop=noteon,0,53,stop,none,Drucktaster Stop und auf Anfang
play_pause=noteon,0,54,play_pause,none,Drucktaster Play / Pause
