<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NanoVNA CLI Accessible - User Manuals">
    <title>User Manuals</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --text-color: #333;
            --bg-color: #fff;
            --code-bg: #f4f4f4;
            --border-color: #ddd;
            --link-color: #2980b9;
            --link-hover: #3498db;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Accessibility */
        a:focus, button:focus {
            outline: 3px solid var(--secondary-color);
            outline-offset: 2px;
        }
        
        /* Skip to main content link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--primary-color);
            color: white;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }
        
        .skip-link:focus {
            top: 0;
        }
        
        /* Header Navigation */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            margin: -20px -20px 30px -20px;
            border-radius: 5px 5px 0 0;
        }
        
        header h1 {
            margin: 0;
            font-size: 1.8em;
        }
        
        nav {
            background-color: var(--code-bg);
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }
        
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        nav a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 3px;
            transition: all 0.2s;
        }
        
        nav a:hover {
            background-color: var(--secondary-color);
            color: white;
        }
        
        nav a[aria-label*="Previous"],
        nav a[aria-label*="Next"] {
            font-weight: bold;
        }
        
        /* Main Content */
        main {
            margin-bottom: 40px;
        }
        
        article {
            background: white;
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: var(--primary-color);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            line-height: 1.3;
        }
        
        h1 {
            font-size: 2.2em;
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 10px;
        }
        
        h2 {
            font-size: 1.8em;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }
        
        h3 {
            font-size: 1.4em;
        }
        
        h4 {
            font-size: 1.2em;
        }
        
        /* Links */
        a {
            color: var(--link-color);
            text-decoration: none;
        }
        
        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }
        
        /* Code */
        code {
            background-color: var(--code-bg);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 0.9em;
        }
        
        pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            overflow-x: auto;
            line-height: 1.4;
        }
        
        pre code {
            background: none;
            padding: 0;
            font-size: 0.95em;
        }
        
        /* Lists */
        ul, ol {
            margin: 15px 0;
            padding-left: 30px;
        }
        
        li {
            margin: 8px 0;
        }
        
        /* Tables */
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
            overflow-x: auto;
            display: block;
        }
        
        thead {
            background-color: var(--primary-color);
            color: white;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid var(--border-color);
        }
        
        tbody tr:nth-child(even) {
            background-color: var(--code-bg);
        }
        
        tbody tr:hover {
            background-color: #e8f4f8;
        }
        
        /* Blockquotes */
        blockquote {
            border-left: 4px solid var(--secondary-color);
            margin: 20px 0;
            padding: 10px 20px;
            background-color: var(--code-bg);
            font-style: italic;
        }
        
        /* Horizontal Rule */
        hr {
            border: none;
            border-top: 2px solid var(--border-color);
            margin: 30px 0;
        }
        
        /* Images */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px 0;
        }
        
        /* Footer */
        footer {
            background-color: var(--code-bg);
            padding: 20px;
            margin: 40px -20px -20px -20px;
            border-top: 2px solid var(--border-color);
            text-align: center;
        }
        
        footer nav {
            background: none;
            border: none;
            padding: 0;
            margin-bottom: 15px;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            header {
                margin: -10px -10px 20px -10px;
                padding: 10px 15px;
            }
            
            header h1 {
                font-size: 1.4em;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            h2 {
                font-size: 1.5em;
            }
            
            nav ul {
                flex-direction: column;
                gap: 10px;
            }
            
            table {
                font-size: 0.9em;
            }
            
            th, td {
                padding: 8px;
            }
        }
        
        /* Print Styles */
        @media print {
            body {
                background: white;
                color: black;
                max-width: 100%;
            }
            
            header, nav, footer {
                background: white;
                border: none;
            }
            
            nav {
                display: none;
            }
            
            a {
                color: black;
                text-decoration: underline;
            }
            
            a[href]:after {
                content: " (" attr(href) ")";
                font-size: 0.8em;
            }
            
            pre, blockquote {
                page-break-inside: avoid;
            }
            
            h1, h2, h3, h4, h5, h6 {
                page-break-after: avoid;
            }
        }
        
        /* Training scenario specific */
        .training-meta {
            background: #e8f4f8;
            border-left: 4px solid var(--secondary-color);
            padding: 15px;
            margin: 20px 0;
        }
        
        .training-meta p {
            margin: 5px 0;
        }
        
        /* Emoji support */
        .emoji {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }
    </style>
</head>
