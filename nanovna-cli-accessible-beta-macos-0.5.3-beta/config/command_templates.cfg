# NanoVNA H4 shell command templates.
# Placeholders: {start}, {stop}, {points}, {outmask}, {caltype}

# One-shot scan (preferred). Replaces scan+data.
SCAN=scan {start} {stop} {points} {outmask}

# Calibration
CAL=cal {caltype}
SAVE_CAL=save
SAVE_CAL_BANK=save {bank}
LOAD_CAL=recall
LOAD_CAL_BANK=recall {bank}
CAL_RESET=cal reset
CAL_DONE=cal done

# Info
GET_INFO=info

# Battery voltage
VBAT=vbat

# Error patterns
ERROR_BANK_EMPTY=Err, default load
