# nanoVNA-cli-accessible settings
serial_port=
baud=9600
start_freq=
end_freq=
step=
command_templates_file=config/command_templates.cfg
audio=1

# Language and display settings
language=eng
bandplan=deu

# Acoustic analysis settings
acoustic_smooth_mode=0
acoustic_time_seconds=5
continuous_replay=1
curve_enabled0=1
curve_enabled1=0
curve_enabled2=0
curve_enabled3=0
curve_enabled4=0

# Volume settings for Synthesizer mode (balanced for waveform mixing)
# SINE=100% (baseline), SQUARE=50%, TRIANGLE=70%, SAWTOOTH=50%, PULSE=50%
curve_volume_synth0=100
curve_volume_synth1=50
curve_volume_synth2=70
curve_volume_synth3=50
curve_volume_synth4=50

# Volume settings for MIDI mode (instruments pre-balanced)
curve_volume_midi0=100
curve_volume_midi1=100
curve_volume_midi2=100
curve_volume_midi3=100
curve_volume_midi4=100

# Master volume control (0-100%)
master_volume=100

# Audio engine settings
audio_engine=0
midi_playback_mode=0

# MIDI interpolated panning (Mischtechniken)
# Enable volume-based pan interpolation for smoother spatial transitions
# 0=disabled, 1=enabled
midi_interpolated_pan_mode=0

# Interpolation strength: how much volume affects perceived pan position
# Range: 0.0 (no effect) to 1.0 (maximum effect)
# Recommended: 0.2-0.4 for subtle effect, 0.5-0.8 for pronounced effect
midi_interpolation_strength=0.3

# Current MIDI instruments (active configuration)
# These are the instruments currently in use and can be customized per curve
# Values will be overwritten when you load a preset via the 'L' command in audio config
midi_instrument0=48
midi_instrument1=19
midi_instrument2=16
midi_instrument3=40
midi_instrument4=81

# MIDI instrument presets for different playback modes
# Gliding mode preset: Sustained instruments (strings, organs, pads, synth leads)
# Best for smooth, continuous playback without note retriggering
# Instruments: String Ensemble, Church Organ, Drawbar Organ, Violin, Lead 2 (Sawtooth)
midi_instruments_gliding0=48
midi_instruments_gliding1=19
midi_instruments_gliding2=16
midi_instruments_gliding3=40
midi_instruments_gliding4=81
# Dotted mode preset: Percussive and articulated instruments
# Best for dotted, articulated playback with note retriggering
# Instruments: Vibraphone, Marimba, Xylophone, Tubular Bells, Celesta
midi_instruments_dotted0=11
midi_instruments_dotted1=12
midi_instruments_dotted2=13
midi_instruments_dotted3=14
midi_instruments_dotted4=8

# Synthesizer frequency range (Hz)
synth_min_freq_hz=100
synth_max_freq_hz=1000
