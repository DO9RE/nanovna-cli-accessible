# nanoVNA-cli-accessible settings
serial_port=
baud=9600
start_freq=0
end_freq=0
step=0
command_templates_file=config/command_templates.cfg
audio=1

# Language and display settings
language=deu
bandplan=deu
first_start=0

# Acoustic analysis settings
acoustic_smooth_mode=0
acoustic_time_seconds=5
continuous_replay=1
curve_enabled0=1
curve_enabled1=0
curve_enabled2=0
curve_enabled3=0
curve_enabled4=0

# Volume settings for Synthesizer mode (balanced for waveform mixing)
# SINE=100% (baseline), SQUARE=50%, TRIANGLE=70%, SAWTOOTH=50%, PULSE=50%
curve_volume_synth0=100
curve_volume_synth1=50
curve_volume_synth2=70
curve_volume_synth3=50
curve_volume_synth4=50

# Volume settings for MIDI mode (instruments pre-balanced)
curve_volume_midi0=100
curve_volume_midi1=100
curve_volume_midi2=100
curve_volume_midi3=100
curve_volume_midi4=100

# Master volume control (0-100%)
master_volume=100

# Y-Axis Ruler (Lineal) settings
ruler_volume=100
ruler_sound_mode=0  # 0=Follow last curve, 1=Custom sound
ruler_custom_sound_synth=0  # Custom waveform for synth mode (0-5)
ruler_custom_sound_midi_gliding=48  # Custom MIDI instrument for gliding mode
ruler_custom_sound_midi_dotted=11  # Custom MIDI instrument for dotted mode
ruler_blip_duration_ms=80  # Duration of shortest blip in ms (30-500)
ruler_lengthening_factor_percent=150  # Lengthening factor in % for longer tones (100-500%, default 150%)

# X-Axis Ruler settings
x_axis_ruler_enabled=0  # X-axis ruler enabled by default
x_axis_ruler_volume=70  # X-axis ruler volume (0-100%, default 70%)
x_axis_ruler_blip_duration_ms=50  # X-axis ruler blip duration in ms (30-200, default 50)
x_axis_ruler_noise_type=0  # X-axis ruler noise type (0=White, 1=Pink, 2=Click, default 0)
x_axis_ruler_midi_drum=42  # X-axis ruler MIDI drum note (35-81, default 42)

# Status line settings
status_line_enabled=0  # Status line enabled by default
status_line_content=3  # Status line content (0=Position, 1=Frequency, 2=SWR, 3=All)
status_line_show_position=1  # Show position in status line
status_line_show_frequency=1  # Show frequency in status line
status_line_show_swr=1  # Show SWR value in status line
status_line_show_rl=0  # Show Return Loss value in status line
status_line_show_impedance=0  # Show Impedance magnitude value in status line
status_line_show_reactance=0  # Show Reactance value in status line
status_line_show_phase=0  # Show Phase value in status line

# Smith diagram audio configuration
smith_cues_volume=30  # Smith ambient cues volume (10-100%, default 30%)
smith_noise_type=0  # Smith noise type (0=Pink, 1=White, 2=Brown, 3=Sine Wave, default 0)
center_pulse_enabled=0  # Center pulse reference signal enabled
center_pulse_volume=40  # Center pulse volume (10-100%, default 40%)
center_pulse_interval=1.0  # Pulse interval in seconds (0.5-2.0, default 1.0)
center_pulse_waveform=0  # Center pulse waveform (0=Click, 1=Sine, 2=Square, 3=Triangle, 4=Sawtooth, 5=Pulse)
axis_events_enabled=0  # Axis crossing events enabled
axis_events_volume=60  # Axis events volume (10-100%, default 60%)
axis_events_duration_ms=100  # Axis events sound duration in ms (50-500, default 100)
axis_events_pitch_min=300.0  # Minimum pitch for gestures in Hz (200-1000, default 300)
axis_events_pitch_max=800.0  # Maximum pitch for gestures in Hz (400-2000, default 800)
axis_crossing_sound=0  # Axis crossing sound type (0=Pluck, 1=Sweep, 2=Chirp, 3=Bell, 4=Percussion)

# Surround sound configuration
surround_enabled=1  # Enable surround sound if available
surround_front_distance=100  # Distance factor for front speakers (50-200%, default 100%)
surround_back_distance=100  # Distance factor for back speakers (50-200%, default 100%)
surround_side_distance=100  # Distance factor for side speakers (50-200%, default 100%)
surround_center_strength=50  # Center channel strength (0-100%, default 50%)
surround_fading_curve=0  # Fading curve (0=Linear, 1=Logarithmic, 2=Exponential, 3=Sine, default 0)
surround_fb_separation=100  # Front/back separation strength (50-200%, default 100%)
surround_side_emphasis=100  # Side channel emphasis (50-200%, default 100%)

# Braille printer settings
braille_protocol=1  # 0=Index V4 (Raster), 1=Index V5 (Floating Dot Area)
braille_paper_size=4  # 0=A4, 1=Letter, 2=A3, 3=Legal, 4=Blista 260x305, 5=Blista 270x340, 6=Blista 297x304
braille_orientation=0  # 0=Portrait, 1=Landscape
braille_coordinate_grid=1  # 0=None, 1=Dots at integers, 2=Grid lines
braille_phase_discontinuity=1  # 0=Arrows, 1=Vertical line with pattern
braille_dpi=18.0  # Dots per inch (10-40, default 18)

# Advanced Braille printer parameters (Index protocol)
braille_top_margin=0  # TM: Top margin in lines (0-10, 0=no margin for max space)
braille_binding_indent=2  # BI: Binding margin/indent (0-10, default 2)
braille_chars_per_line=29  # CH: Characters per line (10-50, default 29)
braille_line_spacing=50  # LS: Line spacing in 0.1mm (50=5.0mm, 100=10.0mm)

# Braille layout percentages (0.80-0.99 for width, 0.60-0.90 for height)
braille_graph_width_percent_portrait=0.95  # Portrait width % (default 0.95)
braille_graph_width_percent_landscape=0.98  # Landscape width % (default 0.98)
braille_graph_height_percent_portrait=0.70  # Portrait height % (default 0.70)
braille_graph_height_percent_landscape=0.85  # Landscape height % (default 0.85)

# Braille origin and spacing (in mm)
braille_origin_x_mm=3.0  # Horizontal offset from left (0-10mm, default 3)
braille_origin_y_mm=0.0  # Vertical offset from text insertion (0-20mm, default 0)
braille_y_axis_space_mm=2.0  # Y-axis label space (1-5mm, default 2)

# Braille curve patterns
braille_curve_pattern0=1-1  # Curve 0 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
braille_curve_pattern1=2-1  # Curve 1 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
braille_curve_pattern2=3-1  # Curve 2 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
braille_curve_pattern3=4-1  # Curve 3 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
braille_curve_pattern4=5-1  # Curve 4 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)

# Audio engine settings
audio_engine=0
midi_playback_mode=0
midi_instrument0=19
midi_instrument1=16
midi_instrument2=81
midi_instrument3=80
midi_instrument4=48

# Synthesizer waveforms (0=SINE, 1=SQUARE, 2=TRIANGLE, 3=SAWTOOTH, 4=SAWTOOTH_INV, 5=PULSE)
synth_waveform0=0
synth_waveform1=1
synth_waveform2=2
synth_waveform3=3
synth_waveform4=5

# MIDI instrument presets for different playback modes
# Gliding mode preset: Sustained instruments (strings, organs, pads, synth leads)
midi_instruments_gliding0=48
midi_instruments_gliding1=19
midi_instruments_gliding2=16
midi_instruments_gliding3=40
midi_instruments_gliding4=81
# Dotted mode preset: Percussive and articulated instruments
midi_instruments_dotted0=11
midi_instruments_dotted1=12
midi_instruments_dotted2=13
midi_instruments_dotted3=14
midi_instruments_dotted4=8

# Synthesizer frequency range (Hz)
synth_min_freq_hz=100
synth_max_freq_hz=1000

# MIDI interpolated panning (Mischtechniken)
# Enable volume-based pan interpolation for smoother spatial transitions
# 0=disabled, 1=enabled
midi_interpolated_pan_mode=0

# Interpolation strength: how much volume affects perceived pan position
# Range: 0.0 (no effect) to 1.0 (maximum effect)
# Recommended: 0.2-0.4 for subtle effect, 0.5-0.8 for pronounced effect
midi_interpolation_strength=0.3

# Dotted mode settings
dotted_duration_ms=30
dotted_pause_ms=60
freeze_point_pause_ms=200
loop_pause_ms=0
inverted_loop_gap_ms=0

# Continuous sweep settings
continuous_sweep_enabled=0
last_measurement_duration_seconds=0.0

# Navigation settings
navigation_jump_width=1

# Calibration settings
calibration_bank=0

# Spatial Audio Calibration
spatial_audio_calibrated=0  # Whether spatial audio wizard has been completed

# User hearing characteristics (from calibration wizard)
spatial_front_back_accuracy=0.50  # Front/back perception accuracy (0.0-1.0)
spatial_left_right_accuracy=0.90  # Left/right perception accuracy (0.0-1.0)
spatial_diagonal_accuracy=0.70  # Diagonal perception accuracy (0.0-1.0)

# Distance perception
spatial_near_threshold=0.30  # Near threshold (0.0-0.5)
spatial_far_threshold=0.70  # Far threshold (0.5-1.0)
spatial_distance_sensitivity=0.50  # Distance sensitivity (0.0-1.0)

# Volume preferences
spatial_preferred_curve_volume=0.70  # Curve sounds volume (0.0-1.0)
spatial_preferred_event_volume=0.60  # Event sounds volume (0.0-1.0)
spatial_preferred_ambient_volume=0.30  # Ambient cues volume (0.0-1.0)

# Sound type preferences
spatial_preferred_axis_crossing_sound=0  # Axis crossing sound index (0-4)
spatial_preferred_center_pulse_waveform=0  # Center pulse waveform index (0-5)

# Psychoacoustic parameters (stereo mode)
spatial_crossfeed_amount=0.15  # Crossfeed amount (0.0-0.5)
spatial_back_attenuation=0.70  # Back sound attenuation (0.5-1.0)
spatial_side_emphasis=0.80  # Side channel emphasis (0.5-1.0)

# Surround-specific parameters
spatial_surround_available=0  # Surround detected during calibration
spatial_front_speaker_distance=1.00  # Front speaker distance (0.5-2.0)
spatial_back_speaker_distance=1.00  # Back speaker distance (0.5-2.0)
spatial_side_speaker_distance=1.00  # Side speaker distance (0.5-2.0)

# MIDI Controller settings
midi_controller_enabled=0  # Enable MIDI controller input
midi_controller_device_id=-1  # MIDI controller device ID (-1 = none)
midi_controller_device_name=  # MIDI controller device name
midi_controller_preset=  # MIDI mapping preset filename
midi_controller_feedback=1  # Send motor fader feedback
midi_controller_freeze_by_touch=0  # Freeze playback when fader touched

# Reactance MIDI Effect Configuration
# Maps reactance sign/magnitude to MIDI effects for audible inductance/capacitance
# Effect types: 0=Reverb, 1=Tremolo(Mod), 2=Chorus, 3=VibratoDepth, 4=VibratoRate, 5=Detune, 6=Brightness, 7=Expression
# Scaling: 0=Linear, 1=SquareRoot, 2=Exponential, 3=Logarithmic, 4=S-Curve
reactance_effects_enabled=1  # Enable reactance MIDI effects
reactance_deadzone_ohms=5.0  # Dead zone around 0 in Ohms (no effects)
reactance_max_ohms=300.0  # Max reactance for full effect intensity

# Gliding mode reactance effects (sustained instruments)
reactance_gliding_capacitive_effect=0
reactance_gliding_capacitive_max=100
reactance_gliding_capacitive_scaling=1
reactance_gliding_inductive_effect=1
reactance_gliding_inductive_max=100
reactance_gliding_inductive_scaling=1

# Dotted mode reactance effects (percussive instruments)
reactance_dotted_capacitive_effect=0
reactance_dotted_capacitive_max=100
reactance_dotted_capacitive_scaling=1
reactance_dotted_inductive_effect=1
reactance_dotted_inductive_max=100
reactance_dotted_inductive_scaling=1

# Synthesizer Reactance DSP Effect Configuration
# DSP effects applied natively to PCM buffer for synth mode reactance sonification
# Effect types: 0=AM_Tremolo, 1=Echo, 2=RingMod, 3=FilterSweep, 4=NoiseMix, 5=Bitcrush

# Smooth mode synth reactance effects
synth_reactance_smooth_capacitive_effect=1
synth_reactance_smooth_capacitive_max=80
synth_reactance_smooth_capacitive_scaling=1
synth_reactance_smooth_inductive_effect=0
synth_reactance_smooth_inductive_max=80
synth_reactance_smooth_inductive_scaling=1

# Dotted mode synth reactance effects
synth_reactance_dotted_capacitive_effect=1
synth_reactance_dotted_capacitive_max=80
synth_reactance_dotted_capacitive_scaling=1
synth_reactance_dotted_inductive_effect=0
synth_reactance_dotted_inductive_max=80
synth_reactance_dotted_inductive_scaling=1

# RL/SWR Range configuration (Pflichtenheft §2, §3)
rl_inverted=1  # 1=inverted (S11-style, default), 0=normal
rl_preset=1  # 0=0-10dB, 1=0-30dB (default), 2=0-60dB, 3=Custom
rl_custom_min=0.0
rl_custom_max=30.0
swr_preset=1  # 0=1-3, 1=1-10 (default), 2=1-20, 3=Custom
swr_custom_min=1.0
swr_custom_max=10.0

# Autoscale configuration (Pflichtenheft §4)
autoscale_enabled=0
autoscale_low_percentile=0.005
autoscale_high_percentile=0.995

# Braille overrides (Pflichtenheft §5) - range/autoscale only
braille_override_range=0
braille_override_autoscale=0
braille_autoscale_enabled=0

# Braille X=0 marker (Pflichtenheft §8)
braille_x0_hysteresis_ohms=5.0

# Table view preferences
table_columns=FREQ,SWR,RL,R,X,Z,PHASE
