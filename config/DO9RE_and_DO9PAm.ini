# Braille Printer Profile: DO9RE_and_DO9PAm
# This profile contains braille printer-specific settings

# Braille printer settings
braille_protocol=1  # 0=Index V4 (Raster), 1=Index V5 (Floating Dot Area)
braille_paper_size=6  # 0=A4, 1=Letter, 2=A3, 3=Legal, 4=Blista 260x305, 5=Blista 270x340, 6=Blista 297x304
braille_orientation=0  # 0=Portrait, 1=Landscape
braille_coordinate_grid=1  # 0=None, 1=Dots at integers, 2=Grid lines
braille_phase_discontinuity=1  # 0=Arrows, 1=Vertical line with pattern
braille_dpi=18.0  # Dots per inch (10-40, default 18)

# Advanced Braille printer parameters (Index protocol)
braille_top_margin=0  # TM: Top margin in lines (0-10, 0=no margin for max space)
braille_binding_indent=0  # BI: Binding margin/indent (0-10, default 2)
braille_chars_per_line=29  # CH: Characters per line (10-50, default 29)
braille_line_spacing=50  # LS: Line spacing in 0.1mm (50=5.0mm, 100=10.0mm)

# Braille layout percentages (0.80-0.99 for width, 0.60-0.90 for height)
braille_graph_width_percent_portrait=0.99  # Portrait width % (default 0.95)
braille_graph_width_percent_landscape=0.99  # Landscape width % (default 0.98)
braille_graph_height_percent_portrait=0.84  # Portrait height % (default 0.70)
braille_graph_height_percent_landscape=0.88  # Landscape height % (default 0.85)

# Braille origin and spacing (in mm)
braille_origin_x_mm=0.0  # Horizontal offset from left (0-10mm, default 3)
braille_origin_y_mm=0.0  # Vertical offset from text insertion (0-20mm, default 0)
braille_y_axis_space_mm=2.0  # Y-axis label space (1-5mm, default 2)

# Braille curve patterns
braille_curve_pattern0=1-1  # Curve 0 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
braille_curve_pattern1=3-2  # Curve 1 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
braille_curve_pattern2=3-2-1-2  # Curve 2 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
braille_curve_pattern3=3-2-1-2-1-2  # Curve 3 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
braille_curve_pattern4=3-2-3-2-1-2  # Curve 4 pattern (e.g., '0'=solid, '2-1'=draw 2+pause 1)
